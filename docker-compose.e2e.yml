# Isolated E2E stack (scripts/e2e.sh): the production images under project "finplat-e2e", with its
# own database and no host ports, so browser tests never touch the public instance on 3810.
#   docker compose -p finplat-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait
services:
  api:
    environment:
      PUBLIC_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8080
      COOKIE_SECURE: "false"
      REGISTRATION_POLICY: open
      MCP_ENABLED: "true"
      BACKUP_SCHEDULE: "off"
      RATE_LIMIT_AUTH_PER_MIN: "1000" # every spec and real-API test registers/logs in
      # SMTP sink on the e2e network (plaintext is allowed for a local relay only)
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: finance@e2e.test
      SMTP_TLS: none
    depends_on:
      mailpit: { condition: service_started }
  gateway:
    ports: !reset []
  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_MAX_MESSAGES: "500"
