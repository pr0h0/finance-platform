# Honour X-Forwarded-Proto from the TLS terminator (cloudflared sets https); default to $scheme.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }
# Real client IP: the cloudflared tunnel connects from a local address and Cloudflare's edge sets
# CF-Connecting-IP (clients cannot override it through the edge). Without it, the TCP peer.
# ponytail: anyone on this host can reach 127.0.0.1:3810 and set CF-Connecting-IP; host-local trust only.
map $http_cf_connecting_ip $client_ip { default $http_cf_connecting_ip; "" $remote_addr; }
map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

upstream api { server api:8080; keepalive 16; }
upstream web { server web:8080; keepalive 8; }

server {
  listen 8080;
  client_max_body_size 64m;   # attachments/imports (client-parsed import = result JSON + base64 source); API enforces per-route limits

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header True-Client-IP "";
    proxy_read_timeout 300s;
    proxy_buffering off;      # SSE (sync notifications)
  }

  location /mcp {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header True-Client-IP "";
    proxy_read_timeout 3600s;
    proxy_buffering off;      # Streamable HTTP / SSE
  }

  # OAuth 2.1 for the remote MCP endpoint: discovery documents and authorize/token/register/revoke.
  location ^~ /.well-known/oauth- {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header True-Client-IP "";
  }

  location /oauth/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header True-Client-IP "";
  }

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
}
