# Runs as the unprivileged nginx user: pid and temp paths under /tmp, listen on 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  # ES module workers (pdf.js worker is .mjs); with nosniff, octet-stream would block them.
  types { text/javascript mjs; }
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # No query strings in logs (cursors, filters may carry data).
  log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /dev/stdout main;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/manifest+json application/yaml;
  include /etc/nginx/conf.d/*.conf;
}
