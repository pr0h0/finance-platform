server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 "ok\n"; }
  # Hashed build assets: cache forever.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # Service worker / manifest / index must revalidate so updates roll out.
  location ~* ^/(sw\.js|manifest\.webmanifest|index\.html)$ { add_header Cache-Control "no-cache"; }
  # SPA fallback.
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
