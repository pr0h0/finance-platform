      operationId: "post_admin_users"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users/{id}:
    patch:
      tags: ["admin"]
      summary: "Disable/enable/promote"
      operationId: "patch_admin_users_id"
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                status:
                  type: "string"
                isAdmin:
                  type: "boolean"
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/stats:
    get:
      tags: ["admin"]
      summary: "Instance statistics"
      operationId: "get_admin_stats"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/audit:
    get:
      tags: ["audit"]
      summary: "Audit log for profile"
      operationId: "get_audit"
      parameters:
        - $ref: "#/components/parameters/ProfileHeader"
        - name: "entityType"
          in: "query"
          schema:
            type: "string"
        - name: "entityId"
          in: "query"
          schema:
            type: "string"
        - name: "action"
          in: "query"
          schema:
            type: "string"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  nextCursor:
                    type: "string"
                required: ["items"]
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/audit:
    get:
      tags: ["admin"]
      summary: "Server-wide audit (admin)"
      operationId: "get_admin_audit"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  nextCursor:
                    type: "string"
                required: ["items"]
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: "apiKey"
      in: "cookie"
      name: "finplat_session"
    bearer:
      type: "http"
      scheme: "bearer"
    mcpToken:
      type: "http"
      scheme: "bearer"
      description: "MCP client token"
  parameters:
    ProfileHeader:
      name: "X-Profile-ID"
      in: "header"
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
      description: "Active financial profile. Required on all profile-scoped endpoints."
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      schema:
        type: "string"
        maxLength: 200
      description: "Makes the mutation safe to retry (24h)."
    Id:
      name: "id"
      in: "path"
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Limit:
      name: "limit"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: "cursor"
      in: "query"
      schema:
        type: "string"
    From:
      name: "from"
      in: "query"
      schema:
        $ref: "#/components/schemas/Date"
    To:
      name: "to"
      in: "query"
      schema:
        $ref: "#/components/schemas/Date"
    Currency:
      name: "currency"
      in: "query"
      schema:
        type: "string"
      description: "Reporting currency (default: profile base currency)"
    AccountIds:
      name: "accountId"
      in: "query"
      schema:
        type: "array"
        items:
          $ref: "#/components/schemas/Uuid"
      style: "form"
      explode: true
  responses:
    Error:
      description: "Error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Uuid:
      type: "string"
      format: "uuid"
      description: "Lowercase UUID. Clients may generate ids (UUIDv7 preferred) for offline creation."
    Date:
      type: "string"
      format: "date"
      description: "Local calendar date YYYY-MM-DD. Never shifted by timezone."
    Instant:
      type: "string"
      format: "date-time"
      description: "RFC 3339 UTC instant."
    Decimal:
      type: "string"
      pattern: "^-?\\d+(\\.\\d+)?$"
      description: "Exact decimal string. Never a JSON number."
    Money:
      type: "object"
      properties:
        amount:
          $ref: "#/components/schemas/Decimal"
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
      required: ["amount", "currency"]
      additionalProperties: false
      description: "Authoritative money representation (ADR 0002): amount has exactly the currency minor-unit scale (\"150.00\" BAM, \"100\" JPY)."
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
            message:
              type: "string"
            requestId:
              type: "string"
            details:
              type: "object"
              additionalProperties: true
          required: ["code", "message"]
          additionalProperties: false
      required: ["error"]
      additionalProperties: false
    SyncMeta:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        profileId:
          $ref: "#/components/schemas/Uuid"
        version:
          type: "integer"
        serverVersion:
          type: "integer"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
        deletedAt:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
      required: ["id", "profileId", "version", "serverVersion", "createdAt", "updatedAt", "deletedAt"]
    Meta:
      type: "object"
      properties:
        name:
          type: "string"
          const: "finance-platform"
        apiVersion:
          type: "string"
        schemaVersion:
          type: "integer"
        syncProtocolVersion:
          type: "integer"
        publicUrl:
          type: "string"
        registrationPolicy:
          type: "string"
          enum: ["open", "invite_only", "closed", "first_user"]
        mcpEnabled:
          type: "boolean"
      required: ["name", "apiVersion", "schemaVersion", "syncProtocolVersion"]
      additionalProperties: false
    Health:
      type: "object"
      properties:
        status:
          type: "string"
          enum: ["ok", "unavailable"]
        database:
          type: "string"
      additionalProperties: false
    User:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: "string"
          format: "email"
        displayName:
          type: "string"
        isAdmin:
          type: "boolean"
        status:
          type: "string"
          enum: ["active", "disabled", "pending"]
        locale:
          type: "string"
        timezone:
          type: "string"
        createdAt:
          $ref: "#/components/schemas/Instant"
      additionalProperties: false
    RegisterRequest:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          minLength: 12
          maxLength: 1024
        displayName:
          type: "string"
      required: ["email", "password"]
      additionalProperties: false
    LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
        device:
          $ref: "#/components/schemas/DeviceRegistration"
      required: ["email", "password"]
      additionalProperties: false
    LoginResponse:
      type: "object"
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: "string"
        token:
          type: "string"
          description: "Only for bearer (native/MCP CLI) clients"
        deviceId:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: false
    DeviceRegistration:
      type: "object"
      properties:
        name:
          type: "string"
        platform:
          type: "string"
          enum: ["web", "android", "ios", "macos", "windows", "linux", "cli", "other"]
        clientVersion:
          type: "string"
        publicKey:
          type: "string"
          contentEncoding: "base64"
      required: ["name", "platform"]
      additionalProperties: false
    Session:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        deviceId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        userAgent:
          type: "string"
        ip:
          oneOf:
            - type: "string"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Instant"
        lastSeenAt:
          $ref: "#/components/schemas/Instant"
        expiresAt:
          $ref: "#/components/schemas/Instant"
        current:
          type: "boolean"
      additionalProperties: false
    Device:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        platform:
          type: "string"
        clientVersion:
          type: "string"
        lastSeenAt:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
        lastSyncAt:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Instant"
      additionalProperties: false
    Profile:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        ownerUserId:
          $ref: "#/components/schemas/Uuid"
        householdId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        baseCurrency:
          type: "string"
        timezone:
          type: "string"
        locale:
          type: "string"
        weekStart:
          type: "integer"
        privacyMode:
          type: "string"
          enum: ["server_readable", "e2ee"]
        role:
          type: "string"
          enum: ["owner", "editor", "viewer"]
        syncVersion:
          type: "integer"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
        deletedAt:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
      additionalProperties: false
    ProfileInput:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        householdId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        baseCurrency:
          type: "string"
        timezone:
          type: "string"
        locale:
          type: "string"
        weekStart:
          type: "integer"
        privacyMode:
          type: "string"
          enum: ["server_readable", "e2ee"]
      required: ["name"]
      additionalProperties: false
    ProfileMember:
      type: "object"
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        email:
          type: "string"
        role:
          type: "string"
          enum: ["owner", "editor", "viewer"]
      additionalProperties: false
    Household:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        createdBy:
          $ref: "#/components/schemas/Uuid"
        createdAt:
          $ref: "#/components/schemas/Instant"
        members:
          type: "array"
          items:
            $ref: "#/components/schemas/HouseholdMember"
      additionalProperties: false
    HouseholdMember:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        userId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        invitedEmail:
          oneOf:
            - type: "string"
            - type: "null"
        role:
          type: "string"
          enum: ["owner", "admin", "member", "viewer"]
        status:
          type: "string"
          enum: ["invited", "active", "removed"]
        joinedAt:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
      additionalProperties: false
    AccountType:
      type: "object"
      properties:
        code:
          type: "string"
        name:
          type: "string"
        classification:
          type: "string"
          enum: ["asset", "liability"]
      additionalProperties: false
    Account:
      allOf:
        - $ref: "#/components/schemas/SyncMeta"
        - type: "object"
          properties:
            name:
              type: "string"
            accountType:
              type: "string"
            currency:
              type: "string"
            isMultiCurrency:
              type: "boolean"
            institution:
              type: "string"
            accountNumberMasked:
              type: "string"
            openingDate:
              oneOf:
                - $ref: "#/components/schemas/Date"
                - type: "null"
            creditLimit:
              oneOf:
                - $ref: "#/components/schemas/Money"
                - type: "null"
            includeInNetWorth:
              type: "boolean"
            includeInSafeToSpend:
              type: "boolean"
            isArchived:
              type: "boolean"
            color:
              type: "string"
            icon:
              type: "string"
            sortOrder:
              type: "integer"
            notes:
              type: "string"
            balances:
              type: "array"
              items:
                $ref: "#/components/schemas/Money"
          additionalProperties: false
    AccountInput:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        accountType:
          type: "string"
        currency:
          type: "string"
        isMultiCurrency:
          type: "boolean"
        institution:
          type: "string"
        accountNumberMasked:
          type: "string"
        openingDate:
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        openingBalance:
          $ref: "#/components/schemas/Money"
        creditLimit:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        includeInNetWorth:
          type: "boolean"
        includeInSafeToSpend:
          type: "boolean"
        isArchived:
          type: "boolean"
        color:
          type: "string"
        icon:
          type: "string"
        sortOrder:
          type: "integer"
        notes:
          type: "string"
        version:
          type: "integer"
          description: "Required on update (optimistic concurrency)"
      required: ["name", "accountType", "currency"]
      additionalProperties: false
    BalancePoint:
      type: "object"
      properties:
        date:
          $ref: "#/components/schemas/Date"
        balance:
          $ref: "#/components/schemas/Money"
      additionalProperties: false
    Reconciliation:
      type: "object"
      properties:
        accountId:
          $ref: "#/components/schemas/Uuid"
        statementDate:
          $ref: "#/components/schemas/Date"
        statementBalance:
          $ref: "#/components/schemas/Money"
        ledgerBalance:
          $ref: "#/components/schemas/Money"
        difference:
          $ref: "#/components/schemas/Money"
        adjustmentTransactionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
      additionalProperties: false
    Category:
      allOf:
        - $ref: "#/components/schemas/SyncMeta"
        - type: "object"
          properties:
            parentId:
              oneOf:
                - $ref: "#/components/schemas/Uuid"
                - type: "null"
            name:
              type: "string"
            kind:
              type: "string"
              enum: ["expense", "income", "transfer"]
            color:
              type: "string"
            icon:
              type: "string"
            sortOrder:
              type: "integer"
            isSystem:
              type: "boolean"
            isArchived:
              type: "boolean"
          additionalProperties: false
    CategoryInput:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        parentId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        name:
          type: "string"
        kind:
          type: "string"
          enum: ["expense", "income", "transfer"]
        color:
          type: "string"
        icon:
          type: "string"
        sortOrder:
          type: "integer"
        isArchived:
          type: "boolean"
        version:
          type: "integer"
      required: ["name"]
      additionalProperties: false
    Tag:
      allOf:
        - $ref: "#/components/schemas/SyncMeta"
        - type: "object"
          properties:
            name:
              type: "string"
            color:
              type: "string"
          additionalProperties: false
    TagInput:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        color:
          type: "string"
        version:
          type: "integer"
      required: ["name"]
      additionalProperties: false
    Merchant:
      allOf:
        - $ref: "#/components/schemas/SyncMeta"
        - type: "object"
          properties:
            name:
              type: "string"
            normalizedName:
              type: "string"
            defaultCategoryId:
              oneOf:
                - $ref: "#/components/schemas/Uuid"
                - type: "null"
            website:
              type: "string"
            notes:
              type: "string"
          additionalProperties: false
    MerchantInput:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        defaultCategoryId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        website:
          type: "string"
        notes:
          type: "string"
        version:
          type: "integer"
      required: ["name"]
      additionalProperties: false
    Posting:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        accountId:
          $ref: "#/components/schemas/Uuid"
        amount:
          $ref: "#/components/schemas/Money"
        originalAmount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        exchangeRateId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        lineNo:
          type: "integer"
        memo:
          type: "string"
      additionalProperties: false
    Split:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: "string"
        notes:
          type: "string"
        sortOrder:
          type: "integer"
      additionalProperties: false
    SplitInput:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: "string"
        notes:
          type: "string"
      required: ["categoryId", "amount"]
      additionalProperties: false
    Transaction:
      allOf:
        - $ref: "#/components/schemas/SyncMeta"
        - type: "object"
          properties:
            kind:
              $ref: "#/components/schemas/TransactionKind"
            status:
              type: "string"
              enum: ["pending", "cleared", "reconciled", "void"]
            bookingDate:
              $ref: "#/components/schemas/Date"
            valueDate:
              oneOf:
                - $ref: "#/components/schemas/Date"
                - type: "null"
            occurredAt:
              oneOf:
                - $ref: "#/components/schemas/Instant"
                - type: "null"
            description:
              type: "string"
            notes:
              type: "string"
            merchantId:
              oneOf:
                - $ref: "#/components/schemas/Uuid"
                - type: "null"
            payee:
              type: "string"
            reference:
              type: "string"
            excludeFromReports:
              type: "boolean"
            source:
              type: "string"
            importRecordId:
              oneOf:
                - $ref: "#/components/schemas/Uuid"
                - type: "null"
            relatedTransactionId:
              oneOf:
                - $ref: "#/components/schemas/Uuid"
                - type: "null"
            correctsTransactionId:
              oneOf:
                - $ref: "#/components/schemas/Uuid"
                - type: "null"
            categorizationSource:
              type: "string"
            postings:
