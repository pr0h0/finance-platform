                $ref: "#/components/schemas/AdminSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: ["admin"]
      summary: "Update server settings"
      operationId: "put_admin_settings"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettings"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users:
    get:
      tags: ["admin"]
      summary: "Users"
