          content:
            application/json:
              schema:
                type: "object"
                properties:
                  profileId:
                    $ref: "#/components/schemas/Uuid"
                  counts:
                    type: "object"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/v1/backups/{id}:
    delete:
