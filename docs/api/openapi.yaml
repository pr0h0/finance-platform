# GENERATED ONCE in Phase 0, now hand-maintained. Source of truth for the REST API.
openapi: "3.1.0"
info:
  title: "Finance Platform API"
  version: "1.0.0"
  license:
    name: "AGPL-3.0-only"
    identifier: "AGPL-3.0-only"
  description: "Source of truth for the REST contract. Module agents refine their own tag sections.\n\nConventions: money is always {amount: decimal string, currency}; dates are local YYYY-MM-DD; profile-scoped endpoints require X-Profile-ID; errors use the Error schema; lists use cursor pagination {items, nextCursor}; important mutations accept Idempotency-Key; updates send the entity `version` and get 409 conflict on mismatch. Cookie-authenticated mutations require the X-CSRF-Token header."
servers:
  - url: "/"
    description: "Same origin (gateway)"
  - url: "https://fin.pr0h0.me"
security:
  - session: []
  - bearer: []
tags:
  - name: "meta"
  - name: "auth"
  - name: "users"
  - name: "profiles"
  - name: "households"
  - name: "accounts"
  - name: "ledger"
  - name: "transactions"
  - name: "categories"
  - name: "merchants"
  - name: "budgets"
  - name: "planning"
  - name: "recurrence"
  - name: "currency"
  - name: "exchangerates"
  - name: "forecasting"
  - name: "analytics"
  - name: "savings"
  - name: "imports"
  - name: "attachments"
  - name: "automation"
  - name: "notifications"
  - name: "sync"
  - name: "mcp"
  - name: "backups"
  - name: "admin"
  - name: "audit"
paths:
  /api/health:
    get:
      tags: ["meta"]
      summary: "Liveness + database check"
      operationId: "get_api_health"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
      security: []
  /api/v1/meta:
    get:
      tags: ["meta"]
      summary: "Server identity and compatibility (Feature 107)"
      operationId: "get_meta"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Error"
      security: []
  /api/v1/auth/register:
    post:
      tags: ["auth"]
      summary: "Register (subject to registration policy)"
      operationId: "post_auth_register"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
      security: []
  /api/v1/auth/login:
    post:
      tags: ["auth"]
      summary: "Log in; sets session cookie (web) or returns bearer token"
      operationId: "post_auth_login"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"
      security: []
  /api/v1/auth/logout:
    post:
      tags: ["auth"]
      summary: "Revoke current session (does NOT delete local data)"
      operationId: "post_auth_logout"
      responses:
        "204":
          description: "No content"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    get:
      tags: ["auth"]
      summary: "Current session, user and CSRF token"
      operationId: "get_auth_session"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/password:
    post:
      tags: ["auth"]
      summary: "Change password"
      operationId: "post_auth_password"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                currentPassword:
                  type: "string"
                newPassword:
                  type: "string"
              required: ["currentPassword", "newPassword"]
              additionalProperties: false
      responses:
        "204":
          description: "No content"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/recovery-codes:
    post:
      tags: ["auth"]
      summary: "Generate recovery codes (shown once)"
      operationId: "post_auth_recovery_codes"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  codes:
                    type: "array"
                    items:
                      type: "string"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/recover:
    post:
      tags: ["auth"]
      summary: "Reset password with a recovery code"
      operationId: "post_auth_recover"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                code:
                  type: "string"
                newPassword:
                  type: "string"
              required: ["email", "code", "newPassword"]
              additionalProperties: false
      responses:
        "204":
          description: "No content"
        default:
          $ref: "#/components/responses/Error"
      security: []
  /api/v1/sessions:
    get:
      tags: ["auth"]
      summary: "List my sessions"
      operationId: "get_sessions"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Session"
                  nextCursor:
                    type: "string"
                required: ["items"]
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}:
    delete:
      tags: ["auth"]
      summary: "Revoke a session"
      operationId: "delete_sessions_id"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: "No content"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/me:
    get:
      tags: ["users"]
      summary: "Current user"
      operationId: "get_users_me"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: ["users"]
      summary: "Update profile fields"
      operationId: "patch_users_me"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                displayName:
                  type: "string"
                locale:
                  type: "string"
                timezone:
                  type: "string"
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/me/settings:
    get:
      tags: ["users"]
      summary: "User settings"
      operationId: "get_users_me_settings"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: ["users"]
      summary: "Replace user settings"
      operationId: "put_users_me_settings"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles:
    get:
      tags: ["profiles"]
      summary: "Profiles I can access"
      operationId: "get_profiles"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Profile"
                  nextCursor:
                    type: "string"
                required: ["items"]
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: ["profiles"]
      summary: "Create profile"
      operationId: "post_profiles"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/{id}:
    get:
      tags: ["profiles"]
      summary: "Get profile"
      operationId: "get_profiles_id"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: ["profiles"]
      summary: "Update profile"
      operationId: "patch_profiles_id"
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: ["profiles"]
      summary: "Delete profile (owner; explicit, separate from logout)"
      operationId: "delete_profiles_id"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: "No content"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/{id}/members:
    get:
      tags: ["profiles"]
      summary: "Profile members"
      operationId: "get_profiles_id_members"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/ProfileMember"
                  nextCursor:
                    type: "string"
                required: ["items"]
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/{id}/members/{userId}:
    put:
      tags: ["profiles"]
      summary: "Add/update member role"
      operationId: "put_profiles_id_members_userId"
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                role:
                  type: "string"
                  enum: ["owner", "editor", "viewer"]
              required: ["role"]
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileMember"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: ["profiles"]
      summary: "Remove member"
      operationId: "delete_profiles_id_members_userId"
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "No content"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/{id}/settings:
    get:
      tags: ["profiles"]
      summary: "Profile settings (dashboard widgets etc.)"
      operationId: "get_profiles_id_settings"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: ["profiles"]
      summary: "Replace profile settings"
      operationId: "put_profiles_id_settings"
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/households:
    get:
      tags: ["households"]
      summary: "My households"
      operationId: "get_households"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Household"
                  nextCursor:
                    type: "string"
                required: ["items"]
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: ["households"]
      summary: "Create household"
      operationId: "post_households"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
              required: ["name"]
              additionalProperties: false
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/households/{id}:
    get:
      tags: ["households"]
      summary: "Get household"
      operationId: "get_households_id"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: ["households"]
      summary: "Rename household"
      operationId: "patch_households_id"
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: ["households"]
      summary: "Delete household"
      operationId: "delete_households_id"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: "No content"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/households/{id}/invitations:
    post:
      tags: ["households"]
      summary: "Invite member by email"
      operationId: "post_households_id_invitations"
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                role:
                  type: "string"
              required: ["email"]
              additionalProperties: false
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  member:
                    $ref: "#/components/schemas/HouseholdMember"
                  inviteToken:
                    type: "string"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/v1/household-invitations/accept:
    post:
      tags: ["households"]
      summary: "Accept invitation"
      operationId: "post_household_invitations_accept"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                token:
                  type: "string"
              required: ["token"]
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/households/{id}/members/{memberId}:
    patch:
      tags: ["households"]
      summary: "Change member role"
      operationId: "patch_households_id_members_memberId"
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: "memberId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                role:
                  type: "string"
              required: ["role"]
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMember"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: ["households"]
      summary: "Remove member"
      operationId: "delete_households_id_members_memberId"
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: "memberId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "No content"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/account-types:
    get:
      tags: ["accounts"]
      summary: "Account types"
      operationId: "get_account_types"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/AccountType"
                  nextCursor:
                    type: "string"
                required: ["items"]
        default:
          $ref: "#/components/responses/Error"
  /api/v1/accounts:
    get:
      tags: ["accounts"]
      summary: "List accounts"
      operationId: "get_accounts"
      parameters:
        - $ref: "#/components/parameters/ProfileHeader"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: "includeArchived"
          in: "query"
          schema:
            type: "boolean"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Account"
                  nextCursor:
                    type: "string"
                required: ["items"]
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: ["accounts"]
      summary: "Create Account"
      operationId: "post_accounts"
      parameters:
        - $ref: "#/components/parameters/ProfileHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/accounts/{id}:
    get:
      tags: ["accounts"]
      summary: "Get Account"
      operationId: "get_accounts_id"
      parameters:
        - $ref: "#/components/parameters/ProfileHeader"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: ["accounts"]
      summary: "Update Account (send version)"
      operationId: "patch_accounts_id"
      parameters:
        - $ref: "#/components/parameters/ProfileHeader"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: ["accounts"]
      summary: "Delete Account (tombstone)"
      operationId: "delete_accounts_id"
      parameters:
        - $ref: "#/components/parameters/ProfileHeader"
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: "No content"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/balances:
    get:
      tags: ["ledger"]
      summary: "Current balances per account and currency (from postings)"
      operationId: "get_balances"
      parameters:
        - $ref: "#/components/parameters/ProfileHeader"
        - name: "asOf"
          in: "query"
          schema:
            type: "string"
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  asOf:
                    $ref: "#/components/schemas/Date"
                  balances:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        accountId:
                          $ref: "#/components/schemas/Uuid"
                        amount:
                          $ref: "#/components/schemas/Money"
                      additionalProperties: false
                  netWorth:
                    $ref: "#/components/schemas/Money"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/v1/accounts/{id}/balance-history:
    get:
      tags: ["ledger"]
      summary: "Daily balance history"
      operationId: "get_accounts_id_balance_history"
      parameters:
        - $ref: "#/components/parameters/ProfileHeader"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  points:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/BalancePoint"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reconciliations:
    post:
      tags: ["ledger"]
      summary: "Reconcile account to a statement balance; optionally create adjustment"
      operationId: "post_reconciliations"
      parameters:
        - $ref: "#/components/parameters/ProfileHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                accountId:
                  $ref: "#/components/schemas/Uuid"
                statementDate:
                  $ref: "#/components/schemas/Date"
                statementBalance:
                  $ref: "#/components/schemas/Money"
                createAdjustment:
                  type: "boolean"
              required: ["accountId", "statementDate", "statementBalance"]
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reconciliation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/transactions:
    get:
      tags: ["transactions"]
      summary: "Search and filter transactions (keyset by bookingDate desc, id)"
