# Native app builds (apps/native, Tauri 2) on GitHub's hosted runners: the platforms this repo's machine
# cannot build (Windows, macOS, iOS) plus Linux and Android. Manual or on a version tag only: macOS
# minutes count 10x and Windows 2x against the free quota of a private repo.
# Artifacts are unsigned (signing secrets: docs/native/README.md "Releases and signing").
name: native

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated: linux, windows, macos, android, ios"
        default: "linux,windows,macos,android,ios"
  push:
    tags: ["v*"]

env:
  PLATFORMS: ${{ github.event.inputs.platforms || 'linux,windows,macos,android,ios' }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: windows
            os: windows-latest
            args: ""
          - name: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: contains(env.PLATFORMS, matrix.name)
      - name: Linux system libraries
        if: contains(env.PLATFORMS, matrix.name) && matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: oven-sh/setup-bun@v2
        if: contains(env.PLATFORMS, matrix.name)
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@stable
        if: contains(env.PLATFORMS, matrix.name)
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        if: contains(env.PLATFORMS, matrix.name)
        with:
          workspaces: apps/native/src-tauri
      - name: Build
        if: contains(env.PLATFORMS, matrix.name)
        working-directory: apps/native
        run: |
          bun install --frozen-lockfile
          bunx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: contains(env.PLATFORMS, matrix.name)
        with:
          name: finplat-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/native/src-tauri/target/**/release/bundle/deb/*.deb
            apps/native/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/native/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/native/src-tauri/target/**/release/bundle/msi/*.msi
            apps/native/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/native/src-tauri/target/**/release/bundle/dmg/*.dmg

  android:
    if: contains(github.event.inputs.platforms || 'android', 'android')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The ubuntu runner ships the Android SDK (ANDROID_HOME); add the NDK and the platform the
      # generated project compiles against (gen/android/app/build.gradle.kts).
      - name: Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
      - name: Build
        working-directory: apps/native
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          bun install --frozen-lockfile
          bunx tauri android build --apk --aab
      - uses: actions/upload-artifact@v4
        with:
          name: finplat-android
          if-no-files-found: error
          path: |
            apps/native/src-tauri/gen/android/app/build/outputs/**/*.apk
            apps/native/src-tauri/gen/android/app/build/outputs/**/*.aab

  ios:
    # Unsigned simulator build: proves the iOS project and Rust code compile. Device builds and
    # TestFlight need an Apple Developer team (docs/native/README.md).
    if: contains(github.event.inputs.platforms || 'ios', 'ios')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
      - name: Build for the simulator
        working-directory: apps/native
        run: |
          bun install --frozen-lockfile
          [ -d src-tauri/gen/apple ] || bunx tauri ios init --ci
          bunx tauri ios build --debug --target aarch64-sim
      - uses: actions/upload-artifact@v4
        with:
          name: finplat-ios-simulator
          if-no-files-found: warn
          path: |
            apps/native/src-tauri/gen/apple/build/**/*.app
